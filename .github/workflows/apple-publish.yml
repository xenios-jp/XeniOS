name: Apple Publish

"on":
  workflow_dispatch:
    inputs:
      channel:
        description: "Publish channel"
        required: true
        default: "release"
        type: choice
        options:
          - "release"
          - "preview"
      stage:
        description: "Release stage"
        required: true
        default: "stable"
        type: choice
        options:
          - "stable"
          - "alpha"
          - "beta"
          - "rc"
      version:
        description: "Marketing version override (optional)"
        required: false
        type: string
      build_number:
        description: "Build number override (optional)"
        required: false
        type: string
  push:
    branches:
      - "preview"
      - "xenios"
    tags:
      - "v*"
      - "release-*"

permissions:
  contents: write

concurrency:
  group: "apple-publish-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  resolve-metadata:
    name: Resolve publish metadata
    runs-on: ubuntu-latest
    outputs:
      channel: "${{ steps.channel.outputs.channel }}"
      stage: "${{ steps.metadata.outputs.stage }}"
      version: "${{ steps.metadata.outputs.version }}"
      build_number: "${{ steps.metadata.outputs.build_number }}"
      commit_short: "${{ steps.metadata.outputs.commit_short }}"
      issued_at: "${{ steps.metadata.outputs.issued_at }}"
      display_label: "${{ steps.metadata.outputs.display_label }}"
      ios_build_id: "${{ steps.metadata.outputs.ios_build_id }}"
      macos_build_id: "${{ steps.metadata.outputs.macos_build_id }}"
      release_tag: "${{ steps.release.outputs.tag }}"
      prerelease: "${{ steps.release.outputs.prerelease }}"
      build_matrix: "${{ steps.build_matrix.outputs.matrix }}"
      publish_macos: "${{ steps.build_matrix.outputs.publish_macos }}"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve publish channel
        id: channel
        shell: bash
        run: |
          set -euo pipefail

          is_preview_ref() {
            [[ "${1}" == "refs/heads/preview" ]]
          }

          is_release_ref() {
            [[ "${1}" == "refs/heads/xenios" || "${1}" == refs/tags/v* || "${1}" == refs/tags/release-* ]]
          }

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            channel="${{ inputs.channel }}"
            if [[ "${channel}" == "preview" ]]; then
              is_preview_ref "${GITHUB_REF}" || {
                echo "::error::Manual preview publishes must run from refs/heads/preview (got ${GITHUB_REF})"
                exit 1
              }
            elif [[ "${channel}" == "release" ]]; then
              is_release_ref "${GITHUB_REF}" || {
                echo "::error::Manual release publishes must run from refs/heads/xenios or release tags (got ${GITHUB_REF})"
                exit 1
              }
            fi
          elif is_preview_ref "${GITHUB_REF}"; then
            channel="preview"
          elif is_release_ref "${GITHUB_REF}"; then
            channel="release"
          else
            echo "::error::Unsupported ref ${GITHUB_REF} for trusted Apple publish"
            exit 1
          fi
          case "${channel}" in
            release|preview)
              ;;
            *)
              echo "::error::Unsupported channel ${channel}"
              exit 1
              ;;
          esac
          echo "channel=${channel}" >> "$GITHUB_OUTPUT"

      - name: Compute publish metadata
        id: metadata
        shell: bash
        env:
          CHANNEL: "${{ steps.channel.outputs.channel }}"
          VERSION_OVERRIDE: "${{ inputs.version }}"
          BUILD_NUMBER_OVERRIDE: "${{ inputs.build_number }}"
          STAGE_OVERRIDE: "${{ inputs.stage }}"
        run: |
          set -euo pipefail
          args=(--channel "${CHANNEL}")
          if [ -n "${VERSION_OVERRIDE}" ]; then
            args+=(--version "${VERSION_OVERRIDE}")
          fi
          if [ -n "${BUILD_NUMBER_OVERRIDE}" ]; then
            args+=(--build-number "${BUILD_NUMBER_OVERRIDE}")
          fi
          if [ -n "${STAGE_OVERRIDE}" ]; then
            args+=(--stage "${STAGE_OVERRIDE}")
          fi
          args+=(--print-metadata)
          ./tools/build_apple_release.sh "${args[@]}" > build-metadata.env

          while IFS='=' read -r key value; do
            case "$key" in
              channel|stage|version|build_number|commit_short|issued_at|display_label|ios_build_id|macos_build_id)
                echo "${key}=${value}" >> "$GITHUB_OUTPUT"
                ;;
            esac
          done < build-metadata.env

      - name: Resolve release identity
        id: release
        shell: bash
        env:
          CHANNEL: "${{ steps.metadata.outputs.channel }}"
          STAGE: "${{ steps.metadata.outputs.stage }}"
          VERSION: "${{ steps.metadata.outputs.version }}"
          BUILD_NUMBER: "${{ steps.metadata.outputs.build_number }}"
        run: |
          set -euo pipefail

          stage_suffix=""
          if [[ -n "${STAGE}" && "${STAGE}" != "stable" ]]; then
            stage_suffix="-${STAGE}"
          fi

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            release_tag="${GITHUB_REF_NAME}"
          elif [[ "${CHANNEL}" == "preview" ]]; then
            release_tag="preview-v${VERSION}-build-${BUILD_NUMBER}${stage_suffix}"
          else
            release_tag="release-v${VERSION}-build-${BUILD_NUMBER}${stage_suffix}"
          fi

          if [[ "${CHANNEL}" == "preview" ]]; then
            prerelease="true"
          else
            prerelease="false"
          fi

          echo "tag=${release_tag}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${prerelease}" >> "$GITHUB_OUTPUT"

      - name: Upload publish metadata
        uses: actions/upload-artifact@v4
        with:
          name: "apple-publish-metadata"
          path: "build-metadata.env"
          if-no-files-found: error
          overwrite: true

      - name: Resolve Apple build matrix
        id: build_matrix
        shell: bash
        env:
          CHANNEL: "${{ steps.metadata.outputs.channel }}"
        run: |
          set -euo pipefail

          if [ "${CHANNEL}" = "preview" ]; then
            matrix='{"include":[{"label":"iOS arm64","runner":"macos-15","artifact_name":"xenios_ios_iphone_ipad","artifact_path":"scratch/artifacts/xenios_ios_iphone_ipad.ipa","script_args":"--skip-macos-arm64 --skip-macos-x86_64","archive_app":false}]}'
            publish_macos="false"
          else
            matrix='{"include":[{"label":"iOS arm64","runner":"macos-15","artifact_name":"xenios_ios_iphone_ipad","artifact_path":"scratch/artifacts/xenios_ios_iphone_ipad.ipa","script_args":"--skip-macos-arm64 --skip-macos-x86_64","archive_app":false},{"label":"macOS Apple Silicon","runner":"macos-15","artifact_name":"xenios_macos_apple_silicon","artifact_path":"scratch/artifacts/xenios_macos_apple_silicon.dmg","script_args":"--skip-ios --skip-macos-x86_64","archive_app":true},{"label":"macOS Intel","runner":"macos-15-intel","artifact_name":"xenios_macos_intel","artifact_path":"scratch/artifacts/xenios_macos_intel.dmg","script_args":"--skip-ios --skip-macos-arm64","archive_app":true}]}'
            publish_macos="true"
          fi

          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"
          echo "publish_macos=${publish_macos}" >> "$GITHUB_OUTPUT"

  build-apple:
    name: "Build ${{ matrix.label }}"
    needs:
      - resolve-metadata
    runs-on: "${{ matrix.runner }}"
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.resolve-metadata.outputs.build_matrix) }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Apple build dependencies
        shell: bash
        run: |
          set -euo pipefail

          retry() {
            local attempts=0
            until "$@"; do
              attempts=$((attempts + 1))
              if [ "$attempts" -ge 5 ]; then
                return 1
              fi
              sleep 5
            done
          }

          brew install ninja

          retry git submodule update --init --depth=1 --recursive -j"$(sysctl -n hw.ncpu)"
          retry git -C third_party/DirectXShaderCompiler submodule update --init --depth=1 \
            external/SPIRV-Headers external/SPIRV-Tools

          ./xenia-build.py fetchdata

      - name: Select Xcode 26.3
        if: "${{ matrix.label == 'iOS arm64' }}"
        run: sudo xcode-select -s /Applications/Xcode_26.3.app

      - name: Build trusted artifact
        shell: bash
        env:
          XENIOS_BUILD_ATTESTATION_KEY: "${{ secrets.XENIOS_BUILD_ATTESTATION_KEY }}"
          XENIOS_BUILD_ATTESTATION_KEY_ID: "${{ secrets.XENIOS_BUILD_ATTESTATION_KEY_ID }}"
          CHANNEL: "${{ needs.resolve-metadata.outputs.channel }}"
          VERSION: "${{ needs.resolve-metadata.outputs.version }}"
          BUILD_NUMBER: "${{ needs.resolve-metadata.outputs.build_number }}"
          STAGE: "${{ needs.resolve-metadata.outputs.stage }}"
          ISSUED_AT: "${{ needs.resolve-metadata.outputs.issued_at }}"
        run: |
          set -euo pipefail
          if [ -z "${XENIOS_BUILD_ATTESTATION_KEY}" ]; then
            echo "::error::XENIOS_BUILD_ATTESTATION_KEY is not configured"
            exit 1
          fi

          args=(--channel "${CHANNEL}" --version "${VERSION}" --build-number "${BUILD_NUMBER}" --stage "${STAGE}" --issued-at "${ISSUED_AT}")
          IFS=' ' read -r -a extra_args <<< "${{ matrix.script_args }}"
          ./tools/build_apple_release.sh "${args[@]}" "${extra_args[@]}"

          test -f "${{ matrix.artifact_path }}"

      - name: Archive macOS app bundle
        if: "${{ matrix.archive_app }}"
        shell: bash
        run: |
          set -euo pipefail

          app_bundle=""
          for build_dir in build build-arm64 build-x64; do
            search_dir="${build_dir}/bin/macOS/Release"
            [ -d "${search_dir}" ] || continue
            found="$(find "${search_dir}" -maxdepth 1 -type d -name "*.app" -print -quit)"
            if [ -n "${found}" ]; then
              app_bundle="${found}"
              break
            fi
          done

          if [ -z "${app_bundle}" ]; then
            echo "::error::macOS app bundle was not found after build"
            exit 1
          fi

          mkdir -p scratch/artifacts/app-bundles
          tar -C "$(dirname "${app_bundle}")" \
            -cpf "scratch/artifacts/app-bundles/${{ matrix.artifact_name }}.app.tar" \
            "$(basename "${app_bundle}")"

      - name: Upload published artifact
        uses: actions/upload-artifact@v4
        with:
          name: "${{ matrix.artifact_name }}"
          path: "${{ matrix.artifact_path }}"
          if-no-files-found: error
          overwrite: true

      - name: Upload macOS app bundle
        if: "${{ matrix.archive_app }}"
        uses: actions/upload-artifact@v4
        with:
          name: "${{ matrix.artifact_name }}_app"
          path: "scratch/artifacts/app-bundles/${{ matrix.artifact_name }}.app.tar"
          if-no-files-found: error
          overwrite: true

  package-macos-universal:
    name: Package macOS Universal
    needs:
      - resolve-metadata
      - build-apple
    if: "${{ needs.resolve-metadata.outputs.publish_macos == 'true' }}"
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Apple Silicon app bundle
        uses: actions/download-artifact@v4
        with:
          name: "xenios_macos_apple_silicon_app"
          path: "artifacts/macos-arm64-app"

      - name: Download Intel app bundle
        uses: actions/download-artifact@v4
        with:
          name: "xenios_macos_intel_app"
          path: "artifacts/macos-x86_64-app"

      - name: Package universal DMG
        shell: bash
        env:
          CHANNEL: "${{ needs.resolve-metadata.outputs.channel }}"
          VERSION: "${{ needs.resolve-metadata.outputs.version }}"
          BUILD_NUMBER: "${{ needs.resolve-metadata.outputs.build_number }}"
          STAGE: "${{ needs.resolve-metadata.outputs.stage }}"
          ISSUED_AT: "${{ needs.resolve-metadata.outputs.issued_at }}"
        run: |
          set -euo pipefail

          mkdir -p artifacts/macos-arm64-app/extracted artifacts/macos-x86_64-app/extracted
          tar -xf artifacts/macos-arm64-app/xenios_macos_apple_silicon.app.tar \
            -C artifacts/macos-arm64-app/extracted
          tar -xf artifacts/macos-x86_64-app/xenios_macos_intel.app.tar \
            -C artifacts/macos-x86_64-app/extracted

          arm64_app="$(find artifacts/macos-arm64-app/extracted -maxdepth 1 -type d -name "*.app" -print -quit)"
          x86_64_app="$(find artifacts/macos-x86_64-app/extracted -maxdepth 1 -type d -name "*.app" -print -quit)"
          if [ -z "${arm64_app}" ] || [ -z "${x86_64_app}" ]; then
            echo "::error::one or both macOS app bundles are missing"
            exit 1
          fi

          ./tools/build_apple_release.sh \
            --channel "${CHANNEL}" \
            --version "${VERSION}" \
            --build-number "${BUILD_NUMBER}" \
            --stage "${STAGE}" \
            --issued-at "${ISSUED_AT}" \
            --package-macos-universal "${arm64_app}" "${x86_64_app}"

          test -f scratch/artifacts/xenios_macos_universal.dmg

      - name: Upload macOS universal artifact
        uses: actions/upload-artifact@v4
        with:
          name: "xenios_macos_universal"
          path: "scratch/artifacts/xenios_macos_universal.dmg"
          if-no-files-found: error
          overwrite: true

  publish:
    name: Publish release and xenios.jp manifests
    needs:
      - resolve-metadata
      - build-apple
      - package-macos-universal
    if: "${{ always() && needs.resolve-metadata.result == 'success' && needs.build-apple.result == 'success' && (needs.resolve-metadata.outputs.publish_macos != 'true' || needs.package-macos-universal.result == 'success') }}"
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download publish metadata
        uses: actions/download-artifact@v4
        with:
          name: "apple-publish-metadata"
          path: "."

      - name: Download iOS artifact
        uses: actions/download-artifact@v4
        with:
          name: "xenios_ios_iphone_ipad"
          path: "artifacts/ios"

      - name: Download macOS Apple Silicon artifact
        if: "${{ needs.resolve-metadata.outputs.publish_macos == 'true' }}"
        uses: actions/download-artifact@v4
        with:
          name: "xenios_macos_apple_silicon"
          path: "artifacts/macos-arm64"

      - name: Download macOS Intel artifact
        if: "${{ needs.resolve-metadata.outputs.publish_macos == 'true' }}"
        uses: actions/download-artifact@v4
        with:
          name: "xenios_macos_intel"
          path: "artifacts/macos-x86_64"

      - name: Download macOS Universal artifact
        if: "${{ needs.resolve-metadata.outputs.publish_macos == 'true' }}"
        uses: actions/download-artifact@v4
        with:
          name: "xenios_macos_universal"
          path: "artifacts/macos-universal"

      - name: Create or update GitHub release
        id: github_release
        shell: bash
        env:
          GH_TOKEN: "${{ github.token }}"
          DISPLAY_LABEL: "${{ needs.resolve-metadata.outputs.display_label }}"
          CHANNEL: "${{ needs.resolve-metadata.outputs.channel }}"
          STAGE: "${{ needs.resolve-metadata.outputs.stage }}"
          VERSION: "${{ needs.resolve-metadata.outputs.version }}"
          BUILD_NUMBER: "${{ needs.resolve-metadata.outputs.build_number }}"
          COMMIT_SHORT: "${{ needs.resolve-metadata.outputs.commit_short }}"
          PUBLISHED_AT: "${{ needs.resolve-metadata.outputs.issued_at }}"
          RELEASE_TAG: "${{ needs.resolve-metadata.outputs.release_tag }}"
          PRERELEASE: "${{ needs.resolve-metadata.outputs.prerelease }}"
          PUBLISH_MACOS: "${{ needs.resolve-metadata.outputs.publish_macos }}"
        run: |
          set -euo pipefail

          {
            printf '# %s\n\n' "${DISPLAY_LABEL}"
            printf -- '- Channel: %s\n' "${CHANNEL}"
            printf -- '- Stage: %s\n' "${STAGE}"
            printf -- '- Version: %s\n' "${VERSION}"
            printf -- '- Build number: %s\n' "${BUILD_NUMBER}"
            printf -- '- Commit: %s\n' "${COMMIT_SHORT}"
            printf -- '- Published at: %s\n' "${PUBLISHED_AT}"
            printf -- '- Source ref: %s\n' "${GITHUB_REF}"
          } > release-notes.md

          jq -n \
            --arg tag "${RELEASE_TAG}" \
            --arg target "${GITHUB_SHA}" \
            --arg name "${DISPLAY_LABEL}" \
            --arg body "$(cat release-notes.md)" \
            --argjson prerelease "${PRERELEASE}" \
            '{
              tag_name: $tag,
              target_commitish: $target,
              name: $name,
              body: $body,
              draft: false,
              prerelease: $prerelease
            } + (if $prerelease then {} else {make_latest: "true"} end)' \
            > release-payload.json

          release_id=""
          if release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" 2>/dev/null)"; then
            release_id="$(jq -r '.id // empty' <<<"${release_json}")"
          fi
          if [ -n "${release_id}" ] && ! [[ "${release_id}" =~ ^[0-9]+$ ]]; then
            echo "::error::Unexpected release id payload for ${RELEASE_TAG}: ${release_id}"
            exit 1
          fi

          if [ -n "${release_id}" ]; then
            gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
              --method PATCH \
              --input release-payload.json \
              >/dev/null
          else
            gh api "repos/${GITHUB_REPOSITORY}/releases" \
              --method POST \
              --input release-payload.json \
              >/dev/null
          fi

          release_assets=(artifacts/ios/xenios_ios_iphone_ipad.ipa)
          if [ "${PUBLISH_MACOS}" = "true" ]; then
            release_assets+=(
              artifacts/macos-universal/xenios_macos_universal.dmg
              artifacts/macos-arm64/xenios_macos_apple_silicon.dmg
              artifacts/macos-x86_64/xenios_macos_intel.dmg
            )
          fi
          gh release upload "${RELEASE_TAG}" "${release_assets[@]}" --clobber

          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" > release.json

          html_url="$(jq -r '.html_url' release.json)"
          ios_download_url="$(jq -r '.assets[] | select(.name == "xenios_ios_iphone_ipad.ipa") | .browser_download_url' release.json)"
          macos_universal_download_url=""
          macos_arm64_download_url=""
          macos_x86_64_download_url=""
          if [ "${PUBLISH_MACOS}" = "true" ]; then
            macos_universal_download_url="$(jq -r '.assets[] | select(.name == "xenios_macos_universal.dmg") | .browser_download_url' release.json)"
            macos_arm64_download_url="$(jq -r '.assets[] | select(.name == "xenios_macos_apple_silicon.dmg") | .browser_download_url' release.json)"
            macos_x86_64_download_url="$(jq -r '.assets[] | select(.name == "xenios_macos_intel.dmg") | .browser_download_url' release.json)"
          fi

          required_outputs=(html_url ios_download_url)
          if [ "${PUBLISH_MACOS}" = "true" ]; then
            required_outputs+=(
              macos_universal_download_url
              macos_arm64_download_url
              macos_x86_64_download_url
            )
          fi
          for output_name in "${required_outputs[@]}"; do
            output_value="${!output_name}"
            if [ -z "${output_value}" ] || [ "${output_value}" = "null" ]; then
              echo "::error::Missing GitHub release output: ${output_name}"
              exit 1
            fi
          done

          {
            echo "html_url=${html_url}"
            echo "ios_download_url=${ios_download_url}"
            echo "macos_universal_download_url=${macos_universal_download_url}"
            echo "macos_arm64_download_url=${macos_arm64_download_url}"
            echo "macos_x86_64_download_url=${macos_x86_64_download_url}"
          } >> "$GITHUB_OUTPUT"

      - name: Validate xenios.jp credentials
        shell: bash
        env:
          GH_TOKEN: "${{ secrets.XENIOS_WEBSITE_PAT }}"
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN}" ]; then
            echo "::error::XENIOS_WEBSITE_PAT is not configured"
            exit 1
          fi
          gh api "repos/xenios-jp/xenios.jp" >/dev/null

      - name: Check out xenios.jp
        uses: actions/checkout@v4
        with:
          repository: "xenios-jp/xenios.jp"
          ref: "main"
          path: "xenios-website"
          token: "${{ secrets.XENIOS_WEBSITE_PAT }}"
          fetch-depth: 0

      - name: Update xenios.jp build manifests
        shell: bash
        env:
          CHANNEL: "${{ needs.resolve-metadata.outputs.channel }}"
          PUBLISH_MACOS: "${{ needs.resolve-metadata.outputs.publish_macos }}"
          RELEASE_URL: "${{ steps.github_release.outputs.html_url }}"
          IOS_DOWNLOAD_URL: "${{ steps.github_release.outputs.ios_download_url }}"
          MACOS_UNIVERSAL_DOWNLOAD_URL: "${{ steps.github_release.outputs.macos_universal_download_url }}"
          MACOS_ARM64_DOWNLOAD_URL: "${{ steps.github_release.outputs.macos_arm64_download_url }}"
          MACOS_X86_64_DOWNLOAD_URL: "${{ steps.github_release.outputs.macos_x86_64_download_url }}"
        run: |
          set -euo pipefail
          args=(
            --website-repo "${GITHUB_WORKSPACE}/xenios-website"
            --metadata-file build-metadata.env
            --channel "${CHANNEL}"
            --release-url "${RELEASE_URL}"
            --ios-ipa "${GITHUB_WORKSPACE}/artifacts/ios/xenios_ios_iphone_ipad.ipa"
            --ios-download-url "${IOS_DOWNLOAD_URL}"
          )
          if [ "${PUBLISH_MACOS}" = "true" ]; then
            args+=(
              --macos-universal-dmg "${GITHUB_WORKSPACE}/artifacts/macos-universal/xenios_macos_universal.dmg"
              --macos-universal-download-url "${MACOS_UNIVERSAL_DOWNLOAD_URL}"
              --macos-arm64-dmg "${GITHUB_WORKSPACE}/artifacts/macos-arm64/xenios_macos_apple_silicon.dmg"
              --macos-arm64-download-url "${MACOS_ARM64_DOWNLOAD_URL}"
              --macos-x86_64-dmg "${GITHUB_WORKSPACE}/artifacts/macos-x86_64/xenios_macos_intel.dmg"
              --macos-x86_64-download-url "${MACOS_X86_64_DOWNLOAD_URL}"
            )
          fi
          python3 tools/update_website_build_manifests.py "${args[@]}"

      - name: Commit xenios.jp build manifests
        shell: bash
        env:
          DISPLAY_LABEL: "${{ needs.resolve-metadata.outputs.display_label }}"
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}/xenios-website"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/release-builds.json data/builds-history.json
          if git diff --staged --quiet; then
            echo "No xenios.jp manifest changes"
            exit 0
          fi
          git commit -m "builds: publish ${DISPLAY_LABEL}"
          git push origin HEAD:main
