name: Apple Publish

# Builds the XeniOS IPA and the Apple Silicon Mac DMG and publishes them as one
# GitHub release, then records both in xenios.jp's build manifests. Ported from
# the public XeniOS repository's workflow (branch xenios) to this tree's CMake
# builds. Intel and universal Mac builds are not built: the site's Mac entry
# lists Apple Silicon only.
#
# Pushes to ci/** branches, and manual runs with "publish" off, build the IPA and
# the DMG and stop: they are workflow artifacts, nothing is published.
#
# Publishing:
# - Publish from the Actions tab or `gh workflow run apple-publish.yml --ref xenios
#   -f notes="$(cat notes.md)"`. The notes are the release body, with the build
#   details appended. Release notes live on the release page only, never in the repo.
# - A push to `xenios` (or `preview`) publishes at once, without notes: the body is
#   just the build details. Prefer the dispatch above for a real release.
# - The release is created as a draft, the IPA and DMG are uploaded, and only then is it
#   published, so what the Discord webhook announces is complete. Tags are never
#   a trigger: create them by hand if wanted.
# - Every push and every published release on xenios-jp/XeniOS posts to Discord,
#   including the tag a publish creates and pre-releases from the preview channel.
#
# Rerunning:
# - "Re-run failed jobs" continues the same release: it finishes an unpublished
#   draft, or retries the xenios.jp manifest update after the release went out.
# - "Re-run all jobs" is refused once the release is published with its IPA (the
#   tag is the same on every attempt). To ship another build, push a new commit or
#   dispatch with a build_number override.
# - Publishes are serialized and never cancelled halfway; build-only runs on the
#   same ref still cancel each other.

"on":
  workflow_dispatch:
    inputs:
      channel:
        description: "Publish channel"
        required: true
        default: "release"
        type: choice
        options:
          - "release"
          - "preview"
      stage:
        description: "Release stage"
        required: true
        default: "stable"
        type: choice
        options:
          - "stable"
          - "alpha"
          - "beta"
          - "rc"
      version:
        description: "Marketing version override (optional)"
        required: false
        type: string
      build_number:
        description: "Build number override (optional)"
        required: false
        type: string
      notes:
        description: "Release notes in Markdown (optional; replaces the body of an existing release)"
        required: false
        type: string
      publish:
        description: "Publish the GitHub release and the xenios.jp manifests (off: build the IPA only)"
        required: true
        default: true
        type: boolean
  push:
    branches:
      - "preview"
      - "xenios"
      - "ci/**"

permissions:
  contents: write

# Every publish shares one group and is never cancelled: two publishes would
# otherwise race on the release and on xenios.jp's manifests, and cancelling one
# halfway can leave a release without its manifest entry. Only build-only runs
# (ci/** pushes, publish off) are per ref and cancel-in-progress.
concurrency:
  group: "${{ ((github.event_name == 'push' && !startsWith(github.ref, 'refs/heads/ci/')) || (github.event_name == 'workflow_dispatch' && inputs.publish)) && 'apple-publish-publish' || format('apple-publish-build-{0}', github.ref) }}"
  cancel-in-progress: "${{ !((github.event_name == 'push' && !startsWith(github.ref, 'refs/heads/ci/')) || (github.event_name == 'workflow_dispatch' && inputs.publish)) }}"

env:
  # Apple's Metal Shader Converter for iPhoneOS. Apple's download needs a developer
  # login, so the dylib is mirrored as an asset of release MSC_IOS_RELEASE_TAG in
  # MSC_IOS_REPO (Apache 2.0 permits it; every IPA ships it too). The hash pins the
  # mirrored bytes and codesign proves they are Apple's.
  MSC_IOS_REPO: "xenios-jp/metal-shader-converter"
  MSC_IOS_RELEASE_TAG: "ios-4.0.3"
  MSC_IOS_SHA256: "bd6b729dcbde133a511d95130eb4d287a1e18b4170453f8b350e78a20bfc37aa"

jobs:
  resolve-metadata:
    name: Resolve publish metadata
    runs-on: ubuntu-latest
    outputs:
      channel: "${{ steps.channel.outputs.channel }}"
      publish: "${{ steps.channel.outputs.publish }}"
      stage: "${{ steps.metadata.outputs.stage }}"
      version: "${{ steps.metadata.outputs.version }}"
      build_number: "${{ steps.metadata.outputs.build_number }}"
      commit_short: "${{ steps.metadata.outputs.commit_short }}"
      issued_at: "${{ steps.metadata.outputs.issued_at }}"
      display_label: "${{ steps.metadata.outputs.display_label }}"
      ios_build_id: "${{ steps.metadata.outputs.ios_build_id }}"
      release_tag: "${{ steps.release.outputs.tag }}"
      prerelease: "${{ steps.release.outputs.prerelease }}"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve publish channel
        id: channel
        shell: bash
        env:
          INPUT_CHANNEL: "${{ inputs.channel }}"
          INPUT_PUBLISH: "${{ inputs.publish }}"
        run: |
          set -euo pipefail

          is_preview_ref() {
            [[ "${1}" == "refs/heads/preview" ]]
          }

          is_release_ref() {
            [[ "${1}" == "refs/heads/xenios" ]]
          }

          publish="true"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            channel="${INPUT_CHANNEL}"
            if [[ "${INPUT_PUBLISH}" != "true" ]]; then
              publish="false"
            elif [[ "${channel}" == "preview" ]]; then
              is_preview_ref "${GITHUB_REF}" || {
                echo "::error::Manual preview publishes must run from refs/heads/preview (got ${GITHUB_REF})"
                exit 1
              }
            elif [[ "${channel}" == "release" ]]; then
              is_release_ref "${GITHUB_REF}" || {
                echo "::error::Manual release publishes must run from refs/heads/xenios (got ${GITHUB_REF})"
                exit 1
              }
            fi
          elif is_preview_ref "${GITHUB_REF}"; then
            channel="preview"
          elif is_release_ref "${GITHUB_REF}"; then
            channel="release"
          elif [[ "${GITHUB_REF}" == refs/heads/ci/* ]]; then
            channel="preview"
            publish="false"
          else
            echo "::error::Unsupported ref ${GITHUB_REF} for trusted Apple publish"
            exit 1
          fi
          case "${channel}" in
            release|preview)
              ;;
            *)
              echo "::error::Unsupported channel ${channel}"
              exit 1
              ;;
          esac
          echo "channel=${channel}" >> "$GITHUB_OUTPUT"
          echo "publish=${publish}" >> "$GITHUB_OUTPUT"

      - name: Compute publish metadata
        id: metadata
        shell: bash
        env:
          CHANNEL: "${{ steps.channel.outputs.channel }}"
          VERSION_OVERRIDE: "${{ inputs.version }}"
          BUILD_NUMBER_OVERRIDE: "${{ inputs.build_number }}"
          STAGE_OVERRIDE: "${{ inputs.stage }}"
          # A publish keeps the build number the same on every attempt (see
          # resolve_release_build_number), so a rerun cannot make a second release.
          XENIOS_PUBLISH_RUN: "${{ steps.channel.outputs.publish }}"
        run: |
          set -euo pipefail
          args=(--channel "${CHANNEL}")
          if [ -n "${VERSION_OVERRIDE}" ]; then
            args+=(--version "${VERSION_OVERRIDE}")
          fi
          if [ -n "${BUILD_NUMBER_OVERRIDE}" ]; then
            args+=(--build-number "${BUILD_NUMBER_OVERRIDE}")
          fi
          if [ -n "${STAGE_OVERRIDE}" ]; then
            args+=(--stage "${STAGE_OVERRIDE}")
          fi
          args+=(--print-metadata)
          ./tools/build_apple_release.sh "${args[@]}" > build-metadata.env

          while IFS='=' read -r key value; do
            case "$key" in
              channel|stage|version|build_number|commit_short|issued_at|display_label|ios_build_id)
                echo "${key}=${value}" >> "$GITHUB_OUTPUT"
                ;;
            esac
          done < build-metadata.env

      - name: Resolve release identity
        id: release
        shell: bash
        env:
          CHANNEL: "${{ steps.channel.outputs.channel }}"
          STAGE: "${{ steps.metadata.outputs.stage }}"
          VERSION: "${{ steps.metadata.outputs.version }}"
          BUILD_NUMBER: "${{ steps.metadata.outputs.build_number }}"
        run: |
          set -euo pipefail

          stage_suffix=""
          if [[ -n "${STAGE}" && "${STAGE}" != "stable" ]]; then
            stage_suffix="-${STAGE}"
          fi

          if [[ "${CHANNEL}" == "preview" ]]; then
            release_tag="preview-v${VERSION}-build-${BUILD_NUMBER}${stage_suffix}"
          else
            release_tag="release-v${VERSION}-build-${BUILD_NUMBER}${stage_suffix}"
          fi

          if [[ "${CHANNEL}" == "preview" ]]; then
            prerelease="true"
          else
            prerelease="false"
          fi

          echo "tag=${release_tag}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${prerelease}" >> "$GITHUB_OUTPUT"

      # Everything a publish needs is checked here, before the hours-long build and
      # before anything is created, so a bad token or a repeat can't leave a half
      # published release behind.
      - name: Preflight the publish
        if: "${{ steps.channel.outputs.publish == 'true' }}"
        shell: bash
        env:
          GH_TOKEN: "${{ github.token }}"
          WEBSITE_TOKEN: "${{ secrets.XENIOS_WEBSITE_PAT }}"
          HAS_ATTESTATION_KEY: "${{ secrets.XENIOS_BUILD_ATTESTATION_KEY != '' }}"
          CHANNEL: "${{ steps.channel.outputs.channel }}"
          STAGE: "${{ steps.metadata.outputs.stage }}"
          BUILD_NUMBER: "${{ steps.metadata.outputs.build_number }}"
          RELEASE_TAG: "${{ steps.release.outputs.tag }}"
        run: |
          set -euo pipefail

          if [ "${HAS_ATTESTATION_KEY}" != "true" ]; then
            echo "::error::XENIOS_BUILD_ATTESTATION_KEY is not configured"
            exit 1
          fi

          # The site's release slot holds stable builds only; the manifest updater
          # would refuse the entry after the release was already public.
          if [[ "${CHANNEL}" == "release" && "${STAGE}" != "stable" ]]; then
            echo "::error::Stage ${STAGE} can't be published on the release channel; use the preview channel"
            exit 1
          fi

          # The same build is never published twice. A release that is public
          # without its IPA, or still a draft, is an unfinished one and may continue.
          if release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" 2>/dev/null)" &&
             [[ "$(jq -r '.draft' <<<"${release_json}")" == "false" ]] &&
             [[ -n "$(jq -r '.assets[] | select(.name == "xenios_ios_iphone_ipad.ipa") | .name' <<<"${release_json}")" ]]; then
            echo "::error::${RELEASE_TAG} is already published with its IPA. Use \"Re-run failed jobs\" to retry the manifest update, or push a new commit (or set build_number) for another build."
            exit 1
          fi

          # The site token must work, and the site must not already be ahead.
          website_json="$(GH_TOKEN="${WEBSITE_TOKEN}" gh api "repos/xenios-jp/xenios.jp")" || {
            echo "::error::XENIOS_WEBSITE_PAT is missing or cannot read xenios-jp/xenios.jp"
            exit 1
          }
          if [[ "$(jq -r '.permissions.push' <<<"${website_json}")" == "false" ]]; then
            echo "::error::XENIOS_WEBSITE_PAT has no push access to xenios-jp/xenios.jp"
            exit 1
          fi
          current="$(GH_TOKEN="${WEBSITE_TOKEN}" gh api -H 'Accept: application/vnd.github.raw+json' \
              "repos/xenios-jp/xenios.jp/contents/data/release-builds.json?ref=main" 2>/dev/null \
            | jq -r --arg channel "${CHANNEL}" '.platforms.ios[$channel].buildNumber // empty' || true)"
          if [ -n "${current}" ] &&
             [ "$(printf '%s\n%s\n' "${current}" "${BUILD_NUMBER}" | sort -V | tail -n 1)" != "${BUILD_NUMBER}" ]; then
            echo "::error::xenios.jp already lists build ${current} on the ${CHANNEL} channel, newer than ${BUILD_NUMBER}"
            exit 1
          fi

      - name: Upload publish metadata
        uses: actions/upload-artifact@v4
        with:
          name: "apple-publish-metadata"
          path: "build-metadata.env"
          if-no-files-found: error

  build-ios:
    name: Build iOS arm64
    needs:
      - resolve-metadata
    # The iOS 27 SDK is needed (crash reporter extension, StateReporting); the
    # macos-26 image tops out at Xcode 26.
    runs-on: xcode-27
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode 27
        shell: bash
        run: |
          set -euo pipefail
          xcode="$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -n 1 || true)"
          if [ -z "${xcode}" ]; then
            echo "::error::No Xcode 27 on this runner:"
            ls -d /Applications/Xcode*.app || true
            exit 1
          fi
          sudo xcode-select -s "${xcode}"
          xcodebuild -version

      - name: Install Metal Toolchain
        # Apple's MobileAsset catalog fetch is flaky; retry with backoff.
        shell: bash
        run: |
          for attempt in 1 2 3 4 5; do
            if sudo xcodebuild -downloadComponent MetalToolchain; then
              exit 0
            fi
            if [ $attempt -lt 5 ]; then
              delay=$((attempt * 30))
              echo "::warning::MetalToolchain download attempt $attempt failed; retrying in ${delay}s"
              sleep $delay
            fi
          done
          echo "::error::MetalToolchain download failed after 5 attempts"
          exit 1

      - name: Cache Slang
        id: cache-slang
        uses: actions/cache@v4
        with:
          path: .slang
          # Keep in sync with SLANG_VERSION in xenia-build.py.
          key: ${{ runner.os }}-${{ runner.arch }}-slang-2026.8

      - name: Download Slang
        if: steps.cache-slang.outputs.cache-hit != 'true'
        run: ./xenia-build.py slang

      - name: Cache Metal Shader Converter (macOS)
        id: cache-msc
        uses: actions/cache@v4
        with:
          path: .metal-shader-converter
          # Keep in sync with MSC_VERSION in xenia-build.py.
          key: ${{ runner.os }}-metal-shader-converter-4.0-beta2

      - name: Download Metal Shader Converter (macOS, for the host shader tool's configure)
        if: steps.cache-msc.outputs.cache-hit != 'true'
        run: ./xenia-build.py msc

      - name: Download Metal Shader Converter (iOS)
        shell: bash
        env:
          GH_TOKEN: "${{ github.token }}"
        run: |
          set -euo pipefail
          msc_dir="${RUNNER_TEMP}/msc-ios"
          mkdir -p "${msc_dir}"
          gh release download "${MSC_IOS_RELEASE_TAG}" --repo "${MSC_IOS_REPO}" \
            --pattern libmetalirconverter.dylib --dir "${msc_dir}" --clobber
          dylib="${msc_dir}/libmetalirconverter.dylib"
          echo "${MSC_IOS_SHA256}  ${dylib}" | shasum -a 256 -c -
          codesign --verify --strict "${dylib}"
          xcrun vtool -show-build "${dylib}" | grep "platform IOS"
          echo "MSC_IOS_LIBRARY=${dylib}" >> "$GITHUB_ENV"

      - name: Fetch submodules and data
        shell: bash
        run: |
          set -euo pipefail
          # DirectXShaderCompiler isn't needed: the DXIL the Metal backend converts
          # comes from Mesa's spirv_to_dxil.
          git submodule update --init --depth=1 -j"$(sysctl -n hw.ncpu)" \
            $(grep -oE 'path = .+' .gitmodules | sed 's/path = //' \
              | grep -v 'DirectXShaderCompiler')
          # wxWidgets has nested submodules that the macOS configure reads.
          git submodule update --init --recursive --depth=1 \
            -j"$(sysctl -n hw.ncpu)" third_party/wxWidgets
          # game-patches and the compatibility data baked into the app.
          ./xenia-build.py fetchdata

      # The runner's default python3 is Homebrew's and refuses pip installs
      # (PEP 668). Mesa imports mako from whichever python3 it finds on PATH.
      - name: Set up Python for Meson
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Meson for spirv_to_dxil
        run: python3 -m pip install --upgrade meson mako pyyaml packaging

      - name: Build the host shader tool
        # The iOS build runs a native macOS xenia-shader-cc from this revision.
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build-host -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-host --target xenia-shader-cc
          tool="$(find build-host -type f -name xenia-shader-cc -perm -u+x -print -quit)"
          [ -n "${tool}" ] || { echo "::error::xenia-shader-cc was not built"; exit 1; }
          echo "XENIA_SHADER_CC=${GITHUB_WORKSPACE}/${tool}" >> "$GITHUB_ENV"

      - name: Configure the iOS build
        shell: bash
        run: |
          set -euo pipefail
          # ThinLTO's object files carry the line tables the crash symbols are made
          # from (the Release build already has -g); ld64 deletes them after the
          # link unless told where to keep them, and dsymutil finds none then.
          mkdir -p build-ios/lto-objects
          cmake -S . -B build-ios -G "Ninja Multi-Config" \
            -DCMAKE_EXE_LINKER_FLAGS="-Wl,-object_path_lto,${GITHUB_WORKSPACE}/build-ios/lto-objects" \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=26.0 \
            -DCMAKE_CONFIGURATION_TYPES=Release \
            -DXENIA_BUILD_IOS_TRACE_APP=OFF \
            -DXENIA_IOS_COMPATIBILITY_DATA_DIR="${GITHUB_WORKSPACE}/build/data_repos/game-compatibility" \
            -DXENIA_IOS_HOST_SHADER_COMPILER="${XENIA_SHADER_CC}" \
            -DXENIA_IOS_SHADER_CONVERTER_LIBRARY="${MSC_IOS_LIBRARY}"

      - name: Build and package the IPA
        shell: bash
        env:
          # The diagnostics Worker counts a build as official only when its
          # ATTESTATION_KEY secret holds this same key. Publishing runs and
          # release candidates (a publish-off run on xenios, the exact IPA a
          # publish would ship) get it; ci/** trials stay unofficial. The script
          # drops it from its environment before the compilers start, keeping it
          # for the stamping at the end.
          XENIOS_BUILD_ATTESTATION_KEY: "${{ (needs.resolve-metadata.outputs.publish == 'true' || github.ref == 'refs/heads/xenios') && secrets.XENIOS_BUILD_ATTESTATION_KEY || '' }}"
          XENIOS_BUILD_ATTESTATION_KEY_ID: "${{ secrets.XENIOS_BUILD_ATTESTATION_KEY_ID }}"
          # Where the app sends diagnostics. The URL isn't secret, so a repository
          # variable can override the Worker's address.
          XENIOS_DIAGNOSTICS_URL: "${{ vars.XENIOS_DIAGNOSTICS_URL || 'https://xenios-diagnostics.xenios.workers.dev/v1/diag' }}"
          PUBLISH: "${{ needs.resolve-metadata.outputs.publish }}"
          CHANNEL: "${{ needs.resolve-metadata.outputs.channel }}"
          VERSION: "${{ needs.resolve-metadata.outputs.version }}"
          BUILD_NUMBER: "${{ needs.resolve-metadata.outputs.build_number }}"
          STAGE: "${{ needs.resolve-metadata.outputs.stage }}"
          ISSUED_AT: "${{ needs.resolve-metadata.outputs.issued_at }}"
        run: |
          set -euo pipefail
          if [ -z "${XENIOS_BUILD_ATTESTATION_KEY}" ]; then
            if [ "${PUBLISH}" = "true" ]; then
              echo "::error::XENIOS_BUILD_ATTESTATION_KEY is not configured"
              exit 1
            fi
            echo "::warning::No attestation key: this build-only IPA reports itself as self-built"
          fi

          ./tools/build_apple_release.sh \
            --ios-build-dir build-ios \
            --out scratch/artifacts \
            --channel "${CHANNEL}" \
            --version "${VERSION}" \
            --build-number "${BUILD_NUMBER}" \
            --stage "${STAGE}" \
            --issued-at "${ISSUED_AT}"

          test -f scratch/artifacts/xenios_ios_iphone_ipad.ipa
          # The crash symbols (tools/ios/make_symbol_map.sh) go on the GitHub release
          # with the IPA; the diagnostics Worker pulls what it needs from there.
          symbols=(scratch/artifacts/symbols/symbols-*.bin)
          test "${#symbols[@]}" -eq 1 && test -f "${symbols[0]}"
          {
            echo "### Crash symbols"
            echo "\`$(basename "${symbols[0]}")\`: $(wc -c < "${symbols[0]}" | tr -d ' ') bytes, attached to the release when it is published."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the IPA
        uses: actions/upload-artifact@v4
        with:
          name: "xenios_ios_iphone_ipad"
          path: "scratch/artifacts/xenios_ios_iphone_ipad.ipa"
          if-no-files-found: error

      - name: Upload the crash symbols
        uses: actions/upload-artifact@v4
        with:
          name: "xenios_ios_symbols"
          path: "scratch/artifacts/symbols/symbols-*.bin"
          if-no-files-found: error
          retention-days: 90

  build-macos:
    name: Build macOS Apple Silicon
    needs:
      - resolve-metadata
    # Same image as the iOS job, so both platforms build with the same Xcode.
    runs-on: xcode-27
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode 27
        shell: bash
        run: |
          set -euo pipefail
          xcode="$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -n 1 || true)"
          if [ -z "${xcode}" ]; then
            echo "::error::No Xcode 27 on this runner:"
            ls -d /Applications/Xcode*.app || true
            exit 1
          fi
          sudo xcode-select -s "${xcode}"
          xcodebuild -version

      - name: Install Metal Toolchain
        # Apple's MobileAsset catalog fetch is flaky; retry with backoff.
        shell: bash
        run: |
          for attempt in 1 2 3 4 5; do
            if sudo xcodebuild -downloadComponent MetalToolchain; then
              exit 0
            fi
            if [ $attempt -lt 5 ]; then
              delay=$((attempt * 30))
              echo "::warning::MetalToolchain download attempt $attempt failed; retrying in ${delay}s"
              sleep $delay
            fi
          done
          echo "::error::MetalToolchain download failed after 5 attempts"
          exit 1

      - name: Cache Slang
        id: cache-slang
        uses: actions/cache@v4
        with:
          path: .slang
          # Keep in sync with SLANG_VERSION in xenia-build.py.
          key: ${{ runner.os }}-${{ runner.arch }}-slang-2026.8

      - name: Download Slang
        if: steps.cache-slang.outputs.cache-hit != 'true'
        run: ./xenia-build.py slang

      - name: Cache Metal Shader Converter (macOS)
        id: cache-msc
        uses: actions/cache@v4
        with:
          path: .metal-shader-converter
          # Keep in sync with MSC_VERSION in xenia-build.py.
          key: ${{ runner.os }}-metal-shader-converter-4.0-beta2

      - name: Download Metal Shader Converter (macOS)
        if: steps.cache-msc.outputs.cache-hit != 'true'
        run: ./xenia-build.py msc

      - name: Fetch submodules and data
        shell: bash
        run: |
          set -euo pipefail
          git submodule update --init --depth=1 -j"$(sysctl -n hw.ncpu)" \
            $(grep -oE 'path = .+' .gitmodules | sed 's/path = //' \
              | grep -v 'DirectXShaderCompiler')
          git submodule update --init --recursive --depth=1 \
            -j"$(sysctl -n hw.ncpu)" third_party/wxWidgets
          ./xenia-build.py fetchdata

      - name: Set up Python for Meson
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Meson for spirv_to_dxil
        run: python3 -m pip install --upgrade meson mako pyyaml packaging

      - name: Configure the macOS build
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build-macos -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64
          # The Mac app's About and crash text read version.h, which xenia-build.py
          # writes after its own configure.
          python3 -c "import runpy; runpy.run_path('xenia-build.py')['generate_version_h']('build-macos')"

      - name: Build and package the DMG
        shell: bash
        env:
          # As for the IPA: publishing runs and release candidates are attested,
          # ci/** trials are not. The script drops the key from its environment
          # before the compilers start.
          XENIOS_BUILD_ATTESTATION_KEY: "${{ (needs.resolve-metadata.outputs.publish == 'true' || github.ref == 'refs/heads/xenios') && secrets.XENIOS_BUILD_ATTESTATION_KEY || '' }}"
          XENIOS_BUILD_ATTESTATION_KEY_ID: "${{ secrets.XENIOS_BUILD_ATTESTATION_KEY_ID }}"
          PUBLISH: "${{ needs.resolve-metadata.outputs.publish }}"
          CHANNEL: "${{ needs.resolve-metadata.outputs.channel }}"
          VERSION: "${{ needs.resolve-metadata.outputs.version }}"
          BUILD_NUMBER: "${{ needs.resolve-metadata.outputs.build_number }}"
          STAGE: "${{ needs.resolve-metadata.outputs.stage }}"
          ISSUED_AT: "${{ needs.resolve-metadata.outputs.issued_at }}"
        run: |
          set -euo pipefail
          if [ -z "${XENIOS_BUILD_ATTESTATION_KEY}" ]; then
            if [ "${PUBLISH}" = "true" ]; then
              echo "::error::XENIOS_BUILD_ATTESTATION_KEY is not configured"
              exit 1
            fi
            echo "::warning::No attestation key: this build-only DMG reports itself as self-built"
          fi

          ./tools/build_apple_release.sh \
            --skip-ios \
            --macos-build-dir build-macos \
            --out scratch/artifacts \
            --channel "${CHANNEL}" \
            --version "${VERSION}" \
            --build-number "${BUILD_NUMBER}" \
            --stage "${STAGE}" \
            --issued-at "${ISSUED_AT}"

          test -f scratch/artifacts/xenios_macos_apple_silicon.dmg

      - name: Upload the DMG
        uses: actions/upload-artifact@v4
        with:
          name: "xenios_macos_apple_silicon"
          path: "scratch/artifacts/xenios_macos_apple_silicon.dmg"
          if-no-files-found: error

  publish-release:
    name: Publish release and xenios.jp manifests
    needs:
      - resolve-metadata
      - build-ios
      - build-macos
    if: "${{ needs.resolve-metadata.outputs.publish == 'true' }}"
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download publish metadata
        uses: actions/download-artifact@v4
        with:
          name: "apple-publish-metadata"
          path: "."

      - name: Download the IPA
        uses: actions/download-artifact@v4
        with:
          name: "xenios_ios_iphone_ipad"
          path: "artifacts/ios"

      - name: Download the DMG
        uses: actions/download-artifact@v4
        with:
          name: "xenios_macos_apple_silicon"
          path: "artifacts/macos-arm64"

      - name: Download the crash symbols
        uses: actions/download-artifact@v4
        with:
          name: "xenios_ios_symbols"
          path: "artifacts/symbols"

      - name: Create or update GitHub release
        id: github_release
        shell: bash
        env:
          GH_TOKEN: "${{ github.token }}"
          DISPLAY_LABEL: "${{ needs.resolve-metadata.outputs.display_label }}"
          CHANNEL: "${{ needs.resolve-metadata.outputs.channel }}"
          STAGE: "${{ needs.resolve-metadata.outputs.stage }}"
          VERSION: "${{ needs.resolve-metadata.outputs.version }}"
          BUILD_NUMBER: "${{ needs.resolve-metadata.outputs.build_number }}"
          COMMIT_SHORT: "${{ needs.resolve-metadata.outputs.commit_short }}"
          PUBLISHED_AT: "${{ needs.resolve-metadata.outputs.issued_at }}"
          RELEASE_TAG: "${{ needs.resolve-metadata.outputs.release_tag }}"
          PRERELEASE: "${{ needs.resolve-metadata.outputs.prerelease }}"
          NOTES: "${{ inputs.notes }}"
        run: |
          set -euo pipefail
          assets=(
            artifacts/ios/xenios_ios_iphone_ipad.ipa
            artifacts/macos-arm64/xenios_macos_apple_silicon.dmg
          )
          repo_api="repos/${GITHUB_REPOSITORY}"

          # Release notes are written on the release page or passed as the notes
          # input. With notes the body is the notes plus the build details; without,
          # a new release starts with the build details alone. A rerun keeps the
          # body on the release page unless notes are given.
          {
            if [ -n "${NOTES}" ]; then
              printf '%s\n\n## Build details\n\n' "${NOTES}"
            else
              printf '# %s\n\n' "${DISPLAY_LABEL}"
            fi
            printf -- '- Channel: %s\n' "${CHANNEL}"
            printf -- '- Stage: %s\n' "${STAGE}"
            printf -- '- Version: %s\n' "${VERSION}"
            printf -- '- Build number: %s\n' "${BUILD_NUMBER}"
            printf -- '- Commit: %s\n' "${COMMIT_SHORT}"
            printf -- '- Published at: %s\n' "${PUBLISHED_AT}"
            printf -- '- Source ref: %s\n' "${GITHUB_REF}"
          } > release-notes.md

          jq -n \
            --arg tag "${RELEASE_TAG}" \
            --arg target "${GITHUB_SHA}" \
            --arg name "${DISPLAY_LABEL}" \
            --rawfile body release-notes.md \
            --argjson prerelease "${PRERELEASE}" \
            '{
              tag_name: $tag,
              target_commitish: $target,
              name: $name,
              body: $body,
              prerelease: $prerelease
            }' \
            > release-payload.json

          # The tag endpoint doesn't return drafts, so list the releases instead.
          release_json="$(gh api --paginate "${repo_api}/releases?per_page=100" \
            | jq -s --arg tag "${RELEASE_TAG}" 'add | map(select(.tag_name == $tag)) | first // empty')"
          release_id="$(jq -r '.id // empty' <<<"${release_json:-null}")"
          if [ -n "${release_id}" ] && ! [[ "${release_id}" =~ ^[0-9]+$ ]]; then
            echo "::error::Unexpected release id payload for ${RELEASE_TAG}: ${release_id}"
            exit 1
          fi

          # 1. A draft (or the existing release, body untouched unless notes were
          #    given), so nothing is announced before the IPA and DMG are attached.
          if [ -n "${release_id}" ]; then
            if [ -n "${NOTES}" ]; then
              cat release-payload.json
            else
              jq 'del(.body)' release-payload.json
            fi | gh api "${repo_api}/releases/${release_id}" --method PATCH --input - >/dev/null
          else
            release_id="$(jq '. + {draft: true}' release-payload.json \
              | gh api "${repo_api}/releases" --method POST --input - --jq '.id')"
            [[ "${release_id}" =~ ^[0-9]+$ ]] || {
              echo "::error::Unexpected release id after creating ${RELEASE_TAG}: ${release_id}"
              exit 1
            }
          fi

          # 2. The IPA and the DMG. An identical asset from an earlier attempt is
          #    kept; anything else with that name is replaced. (gh release upload
          #    can't see drafts.)
          for asset in "${assets[@]}"; do
            asset_name="$(basename "${asset}")"
            asset_size="$(wc -c < "${asset}" | tr -d ' ')"
            release_json="$(gh api "${repo_api}/releases/${release_id}")"
            asset_id="$(jq -r --arg name "${asset_name}" --argjson size "${asset_size}" \
              '.assets[] | select(.name == $name and .state == "uploaded" and .size == $size) | .id' \
              <<<"${release_json}")"
            if [ -z "${asset_id}" ]; then
              jq -r --arg name "${asset_name}" '.assets[] | select(.name == $name) | .id' <<<"${release_json}" \
                | while read -r stale_id; do
                    gh api "${repo_api}/releases/assets/${stale_id}" --method DELETE
                  done
              gh api "https://uploads.github.com/${repo_api}/releases/${release_id}/assets?name=${asset_name}" \
                --method POST \
                -H "Content-Type: application/octet-stream" \
                --input "${asset}" \
                >/dev/null
            fi
            uploaded="$(gh api "${repo_api}/releases/${release_id}" \
              --jq ".assets[] | select(.name == \"${asset_name}\" and .state == \"uploaded\" and .size == ${asset_size}) | .id")"
            if [ -z "${uploaded}" ]; then
              echo "::error::${asset_name} is not attached to ${RELEASE_TAG} as an uploaded asset of ${asset_size} bytes"
              exit 1
            fi
          done

          # 2b. The crash symbols, the same way. The diagnostics Worker finds them at
          #     releases/download/<tag>/symbols-<UUID>.bin once the release is public,
          #     and a build with no such asset (a development build) is never
          #     symbolicated.
          symbols=(artifacts/symbols/symbols-*.bin)
          [ "${#symbols[@]}" -eq 1 ] && [ -f "${symbols[0]}" ] || {
            echo "::error::Expected one symbols-<UUID>.bin in the symbols artifact"
            exit 1
          }
          symbols_name="$(basename "${symbols[0]}")"
          symbols_size="$(wc -c < "${symbols[0]}" | tr -d ' ')"
          release_json="$(gh api "${repo_api}/releases/${release_id}")"
          asset_id="$(jq -r --arg name "${symbols_name}" --argjson size "${symbols_size}" \
            '.assets[] | select(.name == $name and .state == "uploaded" and .size == $size) | .id' \
            <<<"${release_json}")"
          if [ -z "${asset_id}" ]; then
            jq -r --arg name "${symbols_name}" '.assets[] | select(.name == $name) | .id' <<<"${release_json}" \
              | while read -r stale_id; do
                  gh api "${repo_api}/releases/assets/${stale_id}" --method DELETE
                done
            gh api "https://uploads.github.com/${repo_api}/releases/${release_id}/assets?name=${symbols_name}" \
              --method POST \
              -H "Content-Type: application/octet-stream" \
              --input "${symbols[0]}" \
              >/dev/null
          fi
          uploaded="$(gh api "${repo_api}/releases/${release_id}" \
            --jq ".assets[] | select(.name == \"${symbols_name}\" and .state == \"uploaded\" and .size == ${symbols_size}) | .id")"
          if [ -z "${uploaded}" ]; then
            echo "::error::${symbols_name} is not attached to ${RELEASE_TAG} as an uploaded asset of ${symbols_size} bytes"
            exit 1
          fi

          # 3. Publish. Only now does the release become public (and Latest), with
          #    the IPA, the DMG and the symbols already on it.
          if [ "${PRERELEASE}" = "true" ]; then
            publish_payload='{"draft": false, "prerelease": true}'
          else
            publish_payload='{"draft": false, "prerelease": false, "make_latest": "true"}'
          fi
          gh api "${repo_api}/releases/${release_id}" --method PATCH --input - <<<"${publish_payload}" >/dev/null

          gh api "${repo_api}/releases/${release_id}" > release.json

          html_url="$(jq -r '.html_url' release.json)"
          ios_download_url="$(jq -r '.assets[] | select(.name == "xenios_ios_iphone_ipad.ipa") | .browser_download_url' release.json)"
          macos_arm64_download_url="$(jq -r '.assets[] | select(.name == "xenios_macos_apple_silicon.dmg") | .browser_download_url' release.json)"

          for output_name in html_url ios_download_url macos_arm64_download_url; do
            output_value="${!output_name}"
            if [ -z "${output_value}" ] || [ "${output_value}" = "null" ]; then
              echo "::error::Missing GitHub release output: ${output_name}"
              exit 1
            fi
          done
          if [ "$(jq -r '.draft' release.json)" != "false" ]; then
            echo "::error::${RELEASE_TAG} is still a draft after publishing"
            exit 1
          fi

          {
            echo "html_url=${html_url}"
            echo "ios_download_url=${ios_download_url}"
            echo "macos_arm64_download_url=${macos_arm64_download_url}"
          } >> "$GITHUB_OUTPUT"

      - name: Check out xenios.jp
        uses: actions/checkout@v4
        with:
          repository: "xenios-jp/xenios.jp"
          ref: "main"
          path: "xenios-website"
          token: "${{ secrets.XENIOS_WEBSITE_PAT }}"
          fetch-depth: 0

      # Runs only after the release is public. xenios.jp's main takes bot commits
      # often, so a rejected push is retried on a fresh main with the updater run
      # again (it only touches the two manifests).
      - name: Update and push xenios.jp build manifests
        shell: bash
        env:
          CHANNEL: "${{ needs.resolve-metadata.outputs.channel }}"
          DISPLAY_LABEL: "${{ needs.resolve-metadata.outputs.display_label }}"
          RELEASE_URL: "${{ steps.github_release.outputs.html_url }}"
          IOS_DOWNLOAD_URL: "${{ steps.github_release.outputs.ios_download_url }}"
          MACOS_ARM64_DOWNLOAD_URL: "${{ steps.github_release.outputs.macos_arm64_download_url }}"
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}/xenios-website"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            python3 "${GITHUB_WORKSPACE}/tools/update_website_build_manifests.py" \
              --website-repo "${GITHUB_WORKSPACE}/xenios-website" \
              --metadata-file "${GITHUB_WORKSPACE}/build-metadata.env" \
              --channel "${CHANNEL}" \
              --release-url "${RELEASE_URL}" \
              --ios-ipa "${GITHUB_WORKSPACE}/artifacts/ios/xenios_ios_iphone_ipad.ipa" \
              --ios-download-url "${IOS_DOWNLOAD_URL}" \
              --macos-arm64-dmg "${GITHUB_WORKSPACE}/artifacts/macos-arm64/xenios_macos_apple_silicon.dmg" \
              --macos-arm64-download-url "${MACOS_ARM64_DOWNLOAD_URL}"

            git add data/release-builds.json data/builds-history.json
            if git diff --staged --quiet; then
              echo "No xenios.jp manifest changes"
              exit 0
            fi
            git commit -m "builds: publish ${DISPLAY_LABEL}"
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "::warning::Push attempt ${attempt} was rejected; retrying on the latest main"
            git fetch origin main
            git reset --hard origin/main
            sleep $((attempt * 5))
          done
          echo "::error::Could not push the xenios.jp manifests after 3 attempts"
          exit 1
